<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Top 30 · 星數榜</title>
<style>
:root{--bg:#05070f;--card:rgba(255,255,255,.04);--line:rgba(120,200,255,.14);--tx:#e6f1ff;--mu:#7d8fb0;--c1:#00e5ff;--c2:#8b5cf6;--up:#22f59b;--dn:#ff4d6d}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(900px 500px at 15% -10%,rgba(139,92,246,.25),transparent),radial-gradient(800px 500px at 100% 0,rgba(0,229,255,.18),transparent),var(--bg);color:var(--tx);font-family:Inter,"Segoe UI","Noto Sans TC","PingFang TC",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(#000,transparent 70%);opacity:.5;pointer-events:none}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding:48px 20px 64px}
.tag{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--c1);letter-spacing:.2em}
h1{margin:8px 0 6px;font-size:clamp(28px,5vw,46px);background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 10px var(--up);animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
.list{margin-top:28px;display:grid;gap:10px}
.row{display:grid;grid-template-columns:52px 1fr 130px 90px;gap:14px;align-items:center;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);transition:.2s;text-decoration:none;color:inherit}
.row:hover{transform:translateY(-2px);border-color:var(--c1);box-shadow:0 0 24px rgba(0,229,255,.18)}
.hd{background:none;border:none;color:var(--mu);font:12px ui-monospace,monospace;letter-spacing:.1em;padding:0 18px;backdrop-filter:none}
.hd:hover{transform:none;box-shadow:none}
.no{font:700 22px ui-monospace,Menlo,monospace;color:var(--c1)}
.r1 .no{color:#ffd24d}.r2 .no{color:#cfd8e6}.r3 .no{color:#ff9b5e}
.site{display:flex;gap:12px;align-items:center;min-width:0}
.site img{width:38px;height:38px;border-radius:10px;border:1px solid var(--line)}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.st{font:600 16px ui-monospace,monospace;text-align:right}
.st small{display:block;color:var(--up);font-size:11px;font-weight:400}
.ch{font:600 14px ui-monospace,monospace;text-align:center}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--mu)}.nw{color:var(--c2)}
.msg{padding:40px;text-align:center;color:var(--mu);border:1px dashed var(--line);border-radius:14px}
footer{margin-top:28px;color:var(--mu);font-size:12px;text-align:center}
@media(max-width:640px){.row{grid-template-columns:36px 1fr 70px;padding:12px}.row .ch{display:none}.hd{display:none}.st small{display:none}}
</style></head><body><div class="wrap">
<div class="tag">// GITHUB · TOP 30 · STARS &gt; 10K</div>
<h1>GitHub 星數排行榜</h1>
<div class="sub"><span class="dot"></span><span id="upd">載入中…</span><span>· 每天 06:00 (UTC+8) 自動更新</span></div>
<div class="list" id="list"><div class="msg">載入資料中…</div></div>
<footer>資料來源：GitHub Search API · 名次變化與昨日相比</footer>
</div>
<script>
const fmt=n=>n.toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chg(i){
  if(i.is_new)return'<span class="nw">NEW</span>';
  if(i.change==null||i.change===0)return'<span class="fl">—</span>';
  return i.change>0?`<span class="up">▲ ${i.change}</span>`:`<span class="dn">▼ ${-i.change}</span>`;
}
fetch("data.json?t="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  document.getElementById("upd").textContent="最後更新："+d.updated.replace("T"," ");
  let h='<div class="row hd"><div>編號</div><div>網站</div><div style="text-align:right">收藏數</div><div style="text-align:center">名次變化</div></div>';
  d.items.forEach(i=>{
    const sd=i.star_delta>0?`<small>+${fmt(i.star_delta)} 今日</small>`:"";
    h+=`<a class="row r${i.rank}" href="${esc(i.url)}" target="_blank" rel="noopener">
      <div class="no">${String(i.rank).padStart(2,"0")}</div>
      <div class="site"><img src="${esc(i.avatar)}" alt="" loading="lazy"><div style="min-width:0"><div class="nm">${esc(i.name)}</div><div class="ds">${esc(i.desc)}</div></div></div>
      <div class="st">★ ${fmt(i.stars)}${sd}</div><div class="ch">${chg(i)}</div></a>`;
  });
  document.getElementById("list").innerHTML=h;
}).catch(()=>{document.getElementById("list").innerHTML='<div class="msg">尚無資料。請到 GitHub 的 Actions 頁手動執行一次 “Update Top30”。</div>';document.getElementById("upd").textContent="等待首次更新";});
</script></body></html>
